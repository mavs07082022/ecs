<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        body {
            background: var(--primary-navy);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-card .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-card .logo .logo-wrapper {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--primary-green);
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            padding: 8px;
        }
        .login-card .logo .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }
        .login-card .logo h4 {
            font-weight: 700;
            margin-top: 4px;
            color: var(--primary-navy);
        }
        .login-card .logo p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .form-floating {
            margin-bottom: 15px;
            position: relative;
        }
        .form-floating .form-control {
            border-radius: 12px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
            padding: 1rem 0.75rem;
            height: 58px;
        }
        .form-floating .form-control:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 0.2rem rgba(22, 163, 74, 0.1);
        }
        .form-floating label {
            padding: 1rem 0.75rem;
        }
        /* ADDED: Password toggle styles */
        .password-wrapper {
            position: relative;
        }
        .password-wrapper .form-control {
            padding-right: 48px;
        }
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6c757d;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s ease;
            z-index: 10;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toggle-password:hover {
            color: var(--primary-green);
            background: rgba(22, 163, 74, 0.08);
        }
        .toggle-password:focus {
            outline: none;
            color: var(--primary-green);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            background: var(--primary-green);
            color: white;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            background: var(--dark-green);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(22, 163, 74, 0.3);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .back-link:hover {
            color: var(--primary-green);
        }
        .alert-custom {
            border-radius: 12px;
            padding: 12px 16px;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 400px;
            width: 100%;
        }
        .toast {
            border-radius: 12px !important;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            margin-bottom: 10px;
            border: none !important;
        }
        .text-green {
            color: var(--primary-green);
        }
        @media (max-width: 576px) {
            .login-card {
                padding: 30px 20px;
                margin: 0;
            }
            body {
                padding: 10px;
            }
            .login-card .logo .logo-wrapper {
                width: 64px;
                height: 64px;
                padding: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="logo">
                <div class="logo-wrapper">
                    <img src="logoooo.png" alt="Barangay Culiat Logo">
                </div>
                <h4>Barangay Culiat</h4>
                <p>Responder / Admin Login</p>
            </div>

            <div id="loginError" class="alert alert-danger alert-custom" style="display:none;">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span id="errorMessage">Invalid credentials</span>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-floating">
                    <input type="email" class="form-control" id="loginEmail" placeholder="Email" required>
                    <label for="loginEmail"><i class="fas fa-envelope me-2"></i>Email Address</label>
                </div>
                <!-- ADDED: password-wrapper with toggle button -->
                <div class="form-floating password-wrapper">
                    <input type="password" class="form-control" id="loginPassword" placeholder="Password" required>
                    <label for="loginPassword"><i class="fas fa-lock me-2"></i>Password</label>
                    <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt me-2"></i>Login
                </button>
            </form>

            <hr>
            <div class="text-center">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-left me-1"></i>Back to Home
                </a>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script src="js/supabase.js"></script>
    <script>
        // ADDED: Password toggle function
        function togglePassword(inputId, buttonElement) {
            const input = document.getElementById(inputId);
            const icon = buttonElement.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function showToast(message, type = 'info', duration = 5000) {
            const container = document.getElementById('toastContainer');
            const colors = {
                success: 'bg-success text-white',
                danger: 'bg-danger text-white',
                warning: 'bg-warning text-dark',
                info: 'bg-info text-white'
            };
            const icons = {
                success: 'check-circle',
                danger: 'times-circle',
                warning: 'exclamation-triangle',
                info: 'info-circle'
            };
            
            const toast = document.createElement('div');
            toast.className = `toast align-items-center ${colors[type] || colors.info} border-0`;
            toast.role = 'alert';
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="fas fa-${icons[type] || icons.info} me-2"></i>${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            container.appendChild(toast);
            const bsToast = new bootstrap.Toast(toast, { autohide: true, delay: duration });
            bsToast.show();
            setTimeout(() => toast.remove(), duration + 500);
        }

        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            document.getElementById('loginError').style.display = 'none';

            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';

            try {
                console.log('🔐 Attempting login for:', email);
                
                const { data, error } = await supabaseClient.auth.signInWithPassword({ 
                    email, 
                    password 
                });

                if (error) {
                    console.error('❌ Login error:', error);
                    showError(error.message || 'Invalid credentials');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Login';
                    return;
                }

                if (!data.user) {
                    showError('User not found');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Login';
                    return;
                }

                console.log('✅ User authenticated:', data.user.id);

                await new Promise(resolve => setTimeout(resolve, 500));

                const { data: profile, error: profileError } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', data.user.id)
                    .maybeSingle();

                if (profileError) {
                    console.error('❌ Profile error:', profileError);
                }

                if (!profile) {
                    console.log('⚠️ No profile found, creating one...');
                    const { error: insertError } = await supabaseClient
                        .from('profiles')
                        .insert([{
                            id: data.user.id,
                            full_name: data.user.user_metadata?.full_name || 'User',
                            email: email,
                            barangay: data.user.user_metadata?.barangay || 'Unknown',
                            contact_number: data.user.user_metadata?.contact_number || 'N/A',
                            role: data.user.user_metadata?.role || 'resident'
                        }]);
                    
                    if (insertError) {
                        console.error('❌ Profile creation error:', insertError);
                        showError('Profile error. Please contact admin.');
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Login';
                        return;
                    }
                    
                    console.log('✅ Profile created');
                }

                const { data: freshProfile } = await supabaseClient
                    .from('profiles')
                    .select('role')
                    .eq('id', data.user.id)
                    .single();

                const role = freshProfile?.role || 'resident';
                console.log('📝 User role:', role);

                if (role !== 'responder' && role !== 'admin') {
                    console.log('❌ Access denied - role is:', role);
                    showError('Access denied. This page is for responders and admins only.');
                    await supabaseClient.auth.signOut();
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Login';
                    return;
                }

                showToast('✅ Login successful! Redirecting...', 'success', 2000);
                
                setTimeout(() => {
                    window.location.href = 'responder/dashboard.html';
                }, 1500);

            } catch (error) {
                console.error('❌ Login error:', error);
                showError(error.message || 'Login failed. Please try again.');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Login';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('loginError');
            document.getElementById('errorMessage').textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        async function checkSession() {
            try {
                if (window.location.pathname.includes('login.html')) {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    
                    if (session) {
                        console.log('📋 Session found for:', session.user.email);
                        
                        const { data: profile } = await supabaseClient
                            .from('profiles')
                            .select('role')
                            .eq('id', session.user.id)
                            .maybeSingle();
                        
                        const role = profile?.role || 'resident';
                        
                        if (role === 'responder' || role === 'admin') {
                            console.log('✅ User is responder/admin, redirecting to dashboard...');
                            setTimeout(() => {
                                window.location.href = 'responder/dashboard.html';
                            }, 500);
                        } else {
                            console.log('❌ Resident trying to access login page');
                            window.location.href = 'index.html';
                        }
                    } else {
                        console.log('ℹ️ No session found, showing login form');
                    }
                }
            } catch (error) {
                console.error('❌ Session check error:', error);
            }
        }

        async function handleEmailConfirmation() {
            const hash = window.location.hash;
            
            if (hash && hash.includes('access_token')) {
                console.log('📧 Processing email confirmation...');
                showToast('Confirming your email...', 'info', 3000);
                
                try {
                    const { data: { session }, error } = await supabaseClient.auth.getSession();
                    
                    if (error) {
                        console.error('❌ Session error:', error);
                        showToast('Error confirming email. Please try logging in.', 'danger');
                        return;
                    }
                    
                    if (session) {
                        console.log('✅ Email confirmed successfully!');
                        showToast('✅ Email confirmed successfully!', 'success', 3000);
                        
                        const { data: profile } = await supabaseClient
                            .from('profiles')
                            .select('role')
                            .eq('id', session.user.id)
                            .single();
                        
                        const role = profile?.role || 'resident';
                        
                        setTimeout(() => {
                            if (role === 'resident') {
                                window.location.href = 'resident/dashboard.html';
                            } else {
                                window.location.href = 'responder/dashboard.html';
                            }
                        }, 1500);
                    }
                    
                    window.history.replaceState({}, document.title, window.location.pathname);
                    
                } catch (error) {
                    console.error('❌ Confirmation error:', error);
                    showToast('Error confirming email. Please try logging in.', 'danger');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            handleEmailConfirmation();
            checkSession();
            console.log('📄 Login page loaded');
        });

        window.handleLogin = handleLogin;
        window.togglePassword = togglePassword;
    </script>
</body>
</html>
