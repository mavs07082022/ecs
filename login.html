<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responder / Admin Login · Barangay Culiat</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0A2342">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="design.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <script>
    (function () {
      try {
        var k = "culiat-ecs-theme";
        var s = localStorage.getItem(k);
        var d = s === "dark" || (!s && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (d) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      position: relative;
      overflow-x: hidden;
      background: var(--background);
    }
    .theme-toggle-wrap {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 100;
    }
    .login-container { position: relative; z-index: 1; width: 100%; max-width: 440px; }
    .login-card {
      width: 100%;
      padding: 2.5rem 2.1rem;
      background: var(--card);
      color: var(--card-foreground);
      border-radius: calc(var(--radius) + 8px);
      border: 1px solid var(--border);
      box-shadow: 0 32px 80px -12px rgb(0 0 0 / 0.25);
    }
    .login-card .logo { text-align: center; margin-bottom: 1.75rem; }
    .login-card .logo .logo-wrapper {
      width: 84px; height: 84px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--primary);
      margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
      background: color-mix(in oklab, var(--primary) 8%, var(--card));
      padding: 8px;
      box-shadow: 0 8px 24px color-mix(in oklab, var(--primary) 25%, transparent);
    }
    .login-card .logo .logo-wrapper img {
      width: 100%; height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }
    .login-card .logo h4 {
      font-family: "Sora", sans-serif;
      font-weight: 800;
      color: var(--card-foreground);
      letter-spacing: -0.02em;
      margin: 0.5rem 0 0;
      font-size: 1.35rem;
    }
    .login-card .logo .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: color-mix(in oklab, var(--pri-medium) 30%, var(--card));
      color: oklch(0.3 0.09 75);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.35rem 0.8rem;
      border-radius: 9999px;
      margin-top: 0.6rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid color-mix(in oklab, var(--pri-medium) 55%, transparent);
    }
    .dark .login-card .logo .role-badge { color: oklch(0.92 0.09 75); }

    /* password toggle — bottom-right so it doesn't overlap the floating label */
    .password-wrapper { position: relative; }
    .password-wrapper .form-control { padding-right: 3rem !important; }
    .toggle-password {
      position: absolute;
      right: 12px;
      bottom: 12px;
      background: none; border: none;
      color: var(--muted-foreground);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      z-index: 10;
      transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center;
      line-height: 0;
    }
    .toggle-password:hover { color: var(--primary); background: color-mix(in oklab, var(--primary) 10%, transparent); }

    .security-notice {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      background: color-mix(in oklab, var(--primary) 10%, var(--card));
      border: 1px solid color-mix(in oklab, var(--primary) 30%, transparent);
      color: var(--card-foreground);
      font-size: 0.8rem;
      padding: 0.85rem 1rem;
      border-radius: calc(var(--radius) + 2px);
      margin-top: 1rem;
      line-height: 1.5;
      font-weight: 500;
    }
    .security-notice svg, .security-notice .lucide { color: var(--primary); flex-shrink: 0; margin-top: 2px; }
    .back-link {
      color: var(--muted-foreground);
      text-decoration: none;
      transition: color 0.25s ease;
      font-weight: 700;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .back-link:hover { color: var(--primary); }
    .alert-civic-danger {
      border-radius: calc(var(--radius) + 2px);
      padding: 0.85rem 1rem;
      border: 1px solid color-mix(in oklab, var(--destructive) 35%, transparent);
      background: color-mix(in oklab, var(--destructive) 12%, var(--card));
      color: var(--destructive);
      font-size: 0.88rem;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      line-height: 1.5;
    }
    .alert-civic-danger.show { display: flex; }
    @media (max-width: 576px) {
      .login-card { padding: 2rem 1.5rem; }
      body { padding: 0.75rem; }
      .login-card .logo .logo-wrapper { width: 68px; height: 68px; padding: 6px; }
      .login-card .logo h4 { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <div class="theme-toggle-wrap">
    <button type="button" data-theme-toggle class="btn-civic btn-icon theme-toggle-btn" aria-label="Toggle theme">
      <i data-lucide="sun" data-icon="sun" class="theme-toggle-icon" style="width:20px;height:20px;"></i>
      <i data-lucide="moon" data-icon="moon" class="theme-toggle-icon hidden-icon" style="width:20px;height:20px;"></i>
    </button>
  </div>

  <div class="login-container">
    <div class="login-card animate-rise">
      <div class="logo">
        <div class="logo-wrapper">
          <img src="logoooo.png" alt="Barangay Culiat Logo" onerror="this.onerror=null;this.src='sd.png';">
        </div>
        <h4>Barangay Culiat</h4>
        <div class="role-badge">
          <i data-lucide="shield-check" style="width:14px;height:14px;"></i> Responder / Admin Access
        </div>
      </div>

      <div id="loginError" class="alert-civic-danger">
        <i data-lucide="alert-circle" style="width:16px;height:16px;"></i>
        <span id="errorMessage">Invalid credentials</span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" autocomplete="on">
        <div class="form-floating">
          <input type="email" class="form-control" id="loginEmail" placeholder=" " required autocomplete="email">
          <label for="loginEmail"><i data-lucide="mail"></i> Email Address</label>
        </div>
        <div class="form-floating password-wrapper">
          <input type="password" class="form-control" id="loginPassword" placeholder=" " required autocomplete="current-password">
          <label for="loginPassword"><i data-lucide="lock"></i> Password</label>
          <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)" aria-label="Toggle password visibility">
            <i data-lucide="eye" style="width:18px;height:18px;"></i>
          </button>
        </div>
        <button type="submit" class="btn-civic btn-primary btn-lg w-100 mt-2" id="loginBtn">
          <i data-lucide="log-in"></i> Login as Responder / Admin
        </button>
      </form>

      <div class="security-notice">
        <i data-lucide="shield" style="width:16px;height:16px;"></i>
        <div><strong>Authorized personnel only.</strong> </div>
      </div>

      <hr style="margin:1.25rem 0;border-color:var(--border);opacity:1;">

      <div class="text-center">
        <a href="index.html" class="back-link">
          <i data-lucide="arrow-left" style="width:14px;height:14px;"></i> Back to Home
        </a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="design.js"></script>
  <script>
    function togglePassword(inputId, buttonElement) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        buttonElement.innerHTML = '<i data-lucide="eye-off" style="width:18px;height:18px;"></i>';
      } else {
        input.type = 'password';
        buttonElement.innerHTML = '<i data-lucide="eye" style="width:18px;height:18px;"></i>';
      }
      if (window.lucide) window.lucide.createIcons();
    }

    function showToast(message, type = 'info', duration = 5000) {
      const container = document.getElementById('toastContainer');
      const colors = { success: 'bg-success text-white', danger: 'bg-danger text-white', warning: 'bg-warning text-dark', info: 'bg-info text-white' };
      const icons  = { success: 'check-circle-2', danger: 'x-circle', warning: 'alert-triangle', info: 'info' };
      const toast = document.createElement('div');
      toast.className = `toast align-items-center ${colors[type] || colors.info} border-0`;
      toast.role = 'alert';
      toast.innerHTML = `<div class="d-flex"><div class="toast-body"><i data-lucide="${icons[type] || icons.info}" style="width:16px;height:16px;"></i> ${message}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
      container.appendChild(toast);
      if (window.lucide) window.lucide.createIcons();
      const bsToast = new bootstrap.Toast(toast, { autohide: true, delay: duration });
      bsToast.show();
      setTimeout(() => toast.remove(), duration + 500);
    }

    function showError(message) {
      const errorDiv = document.getElementById('loginError');
      document.getElementById('errorMessage').textContent = message;
      errorDiv.classList.add('show');
      setTimeout(() => { errorDiv.classList.remove('show'); }, 6000);
    }

    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');
      document.getElementById('loginError').classList.remove('show');
      if (!email || !password) { showError('Please fill in all fields'); return; }
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';
      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          showError(error.message || 'Invalid credentials');
          btn.disabled = false;
          btn.innerHTML = '<i data-lucide="log-in"></i> Login as Responder / Admin';
          if (window.lucide) window.lucide.createIcons();
          return;
        }
        if (!data.user) {
          showError('User not found');
          btn.disabled = false;
          btn.innerHTML = '<i data-lucide="log-in"></i> Login as Responder / Admin';
          if (window.lucide) window.lucide.createIcons();
          return;
        }
        await new Promise(resolve => setTimeout(resolve, 400));
        const { data: profile, error: profileError } = await supabaseClient
          .from('profiles').select('*').eq('id', data.user.id).maybeSingle();
        if (profileError) console.error('Profile error:', profileError);
        if (!profile) {
          await supabaseClient.from('profiles').insert([{
            id: data.user.id,
            full_name: data.user.user_metadata?.full_name || 'User',
            email: email,
            barangay: data.user.user_metadata?.barangay || 'Unknown',
            contact_number: data.user.user_metadata?.contact_number || 'N/A',
            role: data.user.user_metadata?.role || 'resident'
          }]);
        }
        const { data: freshProfile } = await supabaseClient
          .from('profiles').select('role').eq('id', data.user.id).single();
        const role = freshProfile?.role || 'resident';
        if (role !== 'responder' && role !== 'admin') {
          showError('Access denied. This page is for responders and admins only. Residents must use the main login page.');
          await supabaseClient.auth.signOut();
          btn.disabled = false;
          btn.innerHTML = '<i data-lucide="log-in"></i> Login as Responder / Admin';
          if (window.lucide) window.lucide.createIcons();
          return;
        }
        showToast('Login successful! Redirecting...', 'success', 2000);
        setTimeout(() => { window.location.href = 'responder/dashboard.html'; }, 1200);
      } catch (error) {
        console.error('Login error:', error);
        showError(error.message || 'Login failed. Please try again.');
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="log-in"></i> Login as Responder / Admin';
        if (window.lucide) window.lucide.createIcons();
      }
    }

    async function checkSession() {
      try {
        if (window.location.pathname.includes('login.html')) {
          const { data: { session } } = await supabaseClient.auth.getSession();
          if (session) {
            const { data: profile } = await supabaseClient
              .from('profiles').select('role').eq('id', session.user.id).maybeSingle();
            const role = profile?.role || 'resident';
            if (role === 'responder' || role === 'admin') {
              setTimeout(() => { window.location.href = 'responder/dashboard.html'; }, 500);
            } else {
              await supabaseClient.auth.signOut();
              window.location.href = 'index.html';
            }
          }
        }
      } catch (error) { console.error('Session check error:', error); }
    }

    document.addEventListener('DOMContentLoaded', function() {
      checkSession();
      if (window.lucide) window.lucide.createIcons();
    });

    window.handleLogin = handleLogin;
    window.togglePassword = togglePassword;
  </script>
</body>
</html>
